[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foresightflow-libero"
version = "0.1.0"
description = "ForesightFlow training and evaluation for LIBERO"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fpf_libero*"]
